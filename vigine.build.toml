[recipe]
repo = "llvm-project"
variants = ["release"]
owns = ["libxml2"]

[[dependency]]
repo = "libxml2"
path = "external/libxml2"
branch = "vigine/main"
commit = "de918d45e1b2276a28a4cd32bcf556bef65284e4"

[settings.common]
CMAKE_C_VISIBILITY_PRESET = "default"
CMAKE_CXX_VISIBILITY_PRESET = "default"
CMAKE_VISIBILITY_INLINES_HIDDEN = "ON"
CMAKE_POSITION_INDEPENDENT_CODE = "ON"
BUILD_SHARED_LIBS = "OFF"
CMAKE_DISABLE_FIND_PACKAGE_PkgConfig = "ON"

[settings.macos]
CMAKE_SHARED_LINKER_FLAGS = "-Wl,-dead_strip"
CMAKE_OSX_SYSROOT = "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
LLVM_PARALLEL_LINK_JOBS = "1"
LLVM_PARALLEL_COMPILE_JOBS = "7"

[settings.windows]
CMAKE_SHARED_LINKER_FLAGS = "/machine:x64"
CMAKE_EXE_LINKER_FLAGS = "/machine:x64 bcrypt.lib"
CMAKE_C_FLAGS = "-DLIBXML_STATIC"
CMAKE_CXX_FLAGS = "-DLIBXML_STATIC"
LLVM_PARALLEL_LINK_JOBS = "1"
LLVM_PARALLEL_COMPILE_JOBS = "15"

[settings.linux]
CMAKE_SHARED_LINKER_FLAGS = "-Wl,--exclude-libs,ALL"
LLVM_PARALLEL_LINK_JOBS = "1"
LLVM_PARALLEL_COMPILE_JOBS = "4"

# ---- macOS and Linux: the system compiler is /usr/bin/clang and /usr/bin/clang++ ----

[[step]]
id = "libxml2-bootstrap"
variant = "release"
systems = ["macos", "linux"]
run = "cmake -S external/libxml2 -B build/libxml2-bootstrap/obj -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ {settings} -DCMAKE_INSTALL_PREFIX={repo_root}/build/libxml2-bootstrap -DCMAKE_INSTALL_LIBDIR=lib -DLIBXML2_WITH_ICONV=OFF -DLIBXML2_WITH_ICU=OFF -DLIBXML2_WITH_LZMA=OFF -DLIBXML2_WITH_ZLIB=OFF -DLIBXML2_WITH_PYTHON=OFF -DLIBXML2_WITH_PROGRAMS=OFF -DLIBXML2_WITH_TESTS=OFF -DLIBXML2_WITH_MODULES=OFF && cmake --build build/libxml2-bootstrap/obj && cmake --install build/libxml2-bootstrap/obj"
why = "Our libxml2 is built static by the system compiler first, because LLVM's own stage1 needs a libxml2 and must never take the system one. No python, iconv, lzma, zlib, ICU, modules, programs or tests: LLVM only parses XML in memory, and every extra library would be one more thing the stage1 compiler links."

[[step]]
id = "llvm-stage1"
variant = "release"
systems = ["macos", "linux"]
run = "cmake -S llvm -B build/stage1 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ {settings} \"-DLLVM_ENABLE_PROJECTS=clang;lld\" -DLLVM_TARGETS_TO_BUILD=host -DLLVM_ENABLE_LIBEDIT=OFF -DLLVM_ENABLE_ASSERTIONS=OFF -DLLVM_ENABLE_LIBXML2=FORCE_ON -DLIBXML2_INCLUDE_DIR={repo_root}/build/libxml2-bootstrap/include/libxml2 -DLIBXML2_LIBRARY={repo_root}/build/libxml2-bootstrap/lib/libxml2.a -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_DOCS=OFF && cmake --build build/stage1 --target clang lld"
why = "A minimal first compiler (clang and lld, host target only) built by the system compiler with the bootstrap libxml2. Only what the second pass needs is built; zlib and zstd are off so stage1 depends on nothing but libxml2. It needs neither RTTI nor clang-tools-extra: it only compiles the release pass, so RTTI, exceptions and libedit are left as LLVM builds them by default."

[[step]]
id = "libxml2-ours"
variant = "release"
systems = ["macos", "linux"]
run = "cmake -S external/libxml2 -B build/libxml2/obj -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER={repo_root}/build/stage1/bin/clang -DCMAKE_CXX_COMPILER={repo_root}/build/stage1/bin/clang++ {settings} -DCMAKE_INSTALL_PREFIX={repo_root}/build/libxml2 -DCMAKE_INSTALL_LIBDIR=lib -DLIBXML2_WITH_ICONV=OFF -DLIBXML2_WITH_ICU=OFF -DLIBXML2_WITH_LZMA=OFF -DLIBXML2_WITH_ZLIB=OFF -DLIBXML2_WITH_PYTHON=OFF -DLIBXML2_WITH_PROGRAMS=OFF -DLIBXML2_WITH_TESTS=OFF -DLIBXML2_WITH_MODULES=OFF && cmake --build build/libxml2/obj && cmake --install build/libxml2/obj"
why = "The libxml2 the final compiler links is built by our own compiler (stage1), with the same options as the bootstrap one."

[[step]]
id = "llvm-release"
variant = "release"
systems = ["macos", "linux"]
run = "cmake -S llvm -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER={repo_root}/build/stage1/bin/clang -DCMAKE_CXX_COMPILER={repo_root}/build/stage1/bin/clang++ {settings} \"-DLLVM_ENABLE_PROJECTS=clang;lld;clang-tools-extra\" -DLLVM_ENABLE_RTTI=ON -DLLVM_ENABLE_EH=OFF -DLLVM_ENABLE_LIBEDIT=OFF -DLLVM_TARGETS_TO_BUILD=host -DLLVM_ENABLE_ASSERTIONS=OFF -DLLVM_ENABLE_LIBXML2=FORCE_ON -DLIBXML2_INCLUDE_DIR={repo_root}/build/libxml2/include/libxml2 -DLIBXML2_LIBRARY={repo_root}/build/libxml2/lib/libxml2.a -DLLVM_ENABLE_ZLIB=ON -DLLVM_ENABLE_ZSTD=ON -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_DOCS=OFF && cmake --build build/release"
why = "The compiler: LLVM with clang, lld and clang-tools-extra (clang-tidy, clang-format, clang-include-cleaner are built and installed with it), host target, built by stage1 with our libxml2. LLVM_ENABLE_RTTI=ON: the installed libraries carry RTTI so every consumer (CodeParser) builds against them without a no-RTTI exception (owner, 16.11). LLVM_ENABLE_EH=OFF: exceptions stay off, as in the package installed before. LLVM_ENABLE_LIBEDIT=OFF: libedit is a system library outside our forks, and the compiler takes nothing from the system and is built the same way on every machine (owner, 16.11). Linking uses the linker stage1's clang picks by default (the system one); no -fuse-ld is set. Every other project is built with this compiler."

[[step]]
id = "runtimes"
variant = "release"
systems = ["macos"]
run = "cmake -E env CLANG_NO_DEFAULT_CONFIG=1 cmake -S compiler-rt -B build/runtimes/builtins -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER={repo_root}/build/release/bin/clang -DCMAKE_CXX_COMPILER={repo_root}/build/release/bin/clang++ -DCMAKE_ASM_COMPILER={repo_root}/build/release/bin/clang -DCMAKE_AR={repo_root}/build/release/bin/llvm-ar -DCMAKE_RANLIB={repo_root}/build/release/bin/llvm-ranlib -DCMAKE_LIBTOOL={repo_root}/build/release/bin/llvm-libtool-darwin -DCMAKE_LIPO={repo_root}/build/release/bin/llvm-lipo -DCMAKE_NM={repo_root}/build/release/bin/llvm-nm -DCMAKE_STRIP={repo_root}/build/release/bin/llvm-strip -DCMAKE_INSTALL_NAME_TOOL={repo_root}/build/release/bin/llvm-install-name-tool -DCMAKE_LINKER={repo_root}/build/release/bin/ld64.lld -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_OSX_SYSROOT=/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk -DCMAKE_INSTALL_PREFIX={repo_root}/build/runtimes/stage -DCOMPILER_RT_INSTALL_PATH=lib/clang/23 -DCOMPILER_RT_BUILD_BUILTINS=ON -DCOMPILER_RT_BUILD_CRT=OFF -DCOMPILER_RT_BUILD_SANITIZERS=OFF -DCOMPILER_RT_BUILD_XRAY=OFF -DCOMPILER_RT_BUILD_LIBFUZZER=OFF -DCOMPILER_RT_BUILD_PROFILE=OFF -DCOMPILER_RT_BUILD_MEMPROF=OFF -DCOMPILER_RT_BUILD_ORC=OFF -DCOMPILER_RT_BUILD_CTX_PROFILE=OFF -DCOMPILER_RT_BUILD_GWP_ASAN=OFF -DCOMPILER_RT_INCLUDE_TESTS=OFF -DCOMPILER_RT_ENABLE_IOS=OFF -DCOMPILER_RT_ENABLE_WATCHOS=OFF -DCOMPILER_RT_ENABLE_TVOS=OFF -DCOMPILER_RT_ENABLE_XROS=OFF -DDARWIN_osx_ARCHS=arm64 -DDARWIN_osx_BUILTIN_ARCHS=arm64 && cmake -E env CLANG_NO_DEFAULT_CONFIG=1 cmake --build build/runtimes/builtins -j {jobs:7} --target install && cmake -E env CLANG_NO_DEFAULT_CONFIG=1 cmake -S runtimes -B build/runtimes/cxx -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER={repo_root}/build/release/bin/clang -DCMAKE_CXX_COMPILER={repo_root}/build/release/bin/clang++ -DCMAKE_ASM_COMPILER={repo_root}/build/release/bin/clang -DCMAKE_AR={repo_root}/build/release/bin/llvm-ar -DCMAKE_RANLIB={repo_root}/build/release/bin/llvm-ranlib -DCMAKE_LIBTOOL={repo_root}/build/release/bin/llvm-libtool-darwin -DCMAKE_LIPO={repo_root}/build/release/bin/llvm-lipo -DCMAKE_NM={repo_root}/build/release/bin/llvm-nm -DCMAKE_STRIP={repo_root}/build/release/bin/llvm-strip -DCMAKE_INSTALL_NAME_TOOL={repo_root}/build/release/bin/llvm-install-name-tool -DCMAKE_LINKER={repo_root}/build/release/bin/ld64.lld -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_OSX_SYSROOT=/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk -DCMAKE_INSTALL_PREFIX={repo_root}/build/runtimes/stage \"-DLLVM_ENABLE_RUNTIMES=libcxx;libcxxabi\" -DLIBCXX_CXX_ABI=libcxxabi -DLIBCXX_ABI_NAMESPACE=__vigine -DLIBCXX_ENABLE_SHARED=ON -DLIBCXX_ENABLE_STATIC=OFF -DLIBCXX_INCLUDE_BENCHMARKS=OFF -DLIBCXX_INCLUDE_TESTS=ON -DLIBCXX_STATICALLY_LINK_ABI_IN_SHARED_LIBRARY=ON -DLIBCXXABI_ENABLE_SHARED=OFF -DLIBCXXABI_ENABLE_STATIC=ON -DLIBCXXABI_INSTALL_STATIC_LIBRARY=OFF -DLIBCXXABI_USE_LLVM_UNWINDER=OFF -DLIBCXX_USE_COMPILER_RT=ON -DLIBCXXABI_USE_COMPILER_RT=ON -DLLVM_ENABLE_PER_TARGET_RUNTIME_DIR=OFF -DLIBCXXABI_TEST_CONFIG=llvm-libc++abi-merged.cfg.in -DLLVM_EXTERNAL_LIT={repo_root}/build/release/bin/llvm-lit && cmake -E env CLANG_NO_DEFAULT_CONFIG=1 cmake --build build/runtimes/cxx -j {jobs:7} --target install-cxx install-cxxabi-headers && cmake -E copy_directory build/runtimes/stage build/release && cmake -E copy clang/vigine-config/macos/clang.cfg clang/vigine-config/macos/clang++.cfg build/release/bin && cmake -E env \"LIT_FILTER=vector.cons/|string.cons/\" cmake --build build/runtimes/cxx --target check-cxx && cmake -E env \"LIT_FILTER=catch_|dynamic_cast|test_exception\" cmake --build build/runtimes/cxx --target check-cxxabi"
why = "Our C++ library, built by the compiler just built, every tool of it named, and made the compiler's default. One shared libc++ (install name @rpath/libc++.1.dylib) with libc++abi linked inside it, so the driver's -lc++ alone links and nothing has to be re-exported (our ld64.lld ignores -reexported_symbols_list); its ABI namespace is __vigine because Apple's libc++ is always in the process (the OS loads it for itself) and weak symbols of the same names would coalesce into it. The unwinder is the system's (libSystem): our shared libunwind fails beside it, and one unwinder in the process serves Apple's code and ours. compiler-rt builtins go into the resource folder. Everything is built and installed into build/runtimes/stage first, with CLANG_NO_DEFAULT_CONFIG=1, and only then copied into build/release in one go together with the config files, so build/release never holds the headers without the defaults that make the headers, the library and the link agree. The defaults are config files beside the driver, kept in clang/vigine-config/ (our own files beside clang, no new top-level folder in the fork), not compiled in, so the compiler is not rebuilt for them: -L and -rpath to <CFGDIR>/../lib, lld, and -fno-objc-msgsend-class-selector-stubs, which our lld needs for Objective-C against this SDK. The tests then run against what is now in build/release."

[[step]]
id = "runtimes-linux"
variant = "release"
systems = ["linux"]
run = "cmake -E env CLANG_NO_DEFAULT_CONFIG=1 cmake -S compiler-rt -B build/runtimes/builtins -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER={repo_root}/build/release/bin/clang -DCMAKE_CXX_COMPILER={repo_root}/build/release/bin/clang++ -DCMAKE_ASM_COMPILER={repo_root}/build/release/bin/clang -DCMAKE_AR={repo_root}/build/release/bin/llvm-ar -DCMAKE_RANLIB={repo_root}/build/release/bin/llvm-ranlib -DCMAKE_NM={repo_root}/build/release/bin/llvm-nm -DCMAKE_STRIP={repo_root}/build/release/bin/llvm-strip -DCMAKE_OBJCOPY={repo_root}/build/release/bin/llvm-objcopy -DCMAKE_LINKER={repo_root}/build/release/bin/ld.lld -DCMAKE_INSTALL_PREFIX={repo_root}/build/runtimes/stage -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld -DCOMPILER_RT_INSTALL_PATH=lib/clang/23 -DCOMPILER_RT_BUILD_BUILTINS=ON -DCOMPILER_RT_BUILD_CRT=ON -DCOMPILER_RT_EXCLUDE_ATOMIC_BUILTIN=OFF -DCOMPILER_RT_DEFAULT_TARGET_ONLY=ON -DLLVM_ENABLE_PER_TARGET_RUNTIME_DIR=ON -DCOMPILER_RT_BUILD_SANITIZERS=OFF -DCOMPILER_RT_BUILD_XRAY=OFF -DCOMPILER_RT_BUILD_LIBFUZZER=OFF -DCOMPILER_RT_BUILD_PROFILE=OFF -DCOMPILER_RT_BUILD_MEMPROF=OFF -DCOMPILER_RT_BUILD_ORC=OFF -DCOMPILER_RT_BUILD_CTX_PROFILE=OFF -DCOMPILER_RT_BUILD_GWP_ASAN=OFF -DCOMPILER_RT_INCLUDE_TESTS=OFF && cmake -E env CLANG_NO_DEFAULT_CONFIG=1 cmake --build build/runtimes/builtins -j {jobs:4} --target install && cmake -E copy_directory build/release/lib/clang/23 build/runtimes/resource && cmake -E copy_directory build/runtimes/stage/lib/clang/23 build/runtimes/resource && cmake -E env CLANG_NO_DEFAULT_CONFIG=1 cmake -S runtimes -B build/runtimes/cxx -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER={repo_root}/build/release/bin/clang -DCMAKE_CXX_COMPILER={repo_root}/build/release/bin/clang++ -DCMAKE_ASM_COMPILER={repo_root}/build/release/bin/clang -DCMAKE_AR={repo_root}/build/release/bin/llvm-ar -DCMAKE_RANLIB={repo_root}/build/release/bin/llvm-ranlib -DCMAKE_NM={repo_root}/build/release/bin/llvm-nm -DCMAKE_STRIP={repo_root}/build/release/bin/llvm-strip -DCMAKE_OBJCOPY={repo_root}/build/release/bin/llvm-objcopy -DCMAKE_LINKER={repo_root}/build/release/bin/ld.lld -DCMAKE_INSTALL_PREFIX={repo_root}/build/runtimes/stage -DCMAKE_C_FLAGS=-resource-dir={repo_root}/build/runtimes/resource -DCMAKE_CXX_FLAGS=-resource-dir={repo_root}/build/runtimes/resource -DCMAKE_ASM_FLAGS=-resource-dir={repo_root}/build/runtimes/resource \"-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld --rtlib=compiler-rt --unwindlib=none\" \"-DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld --rtlib=compiler-rt --unwindlib=none\" \"-DLLVM_ENABLE_RUNTIMES=libcxx;libcxxabi;libunwind\" -DLIBCXX_CXX_ABI=libcxxabi -DLIBCXX_ABI_NAMESPACE=__vigine -DLIBCXX_ENABLE_SHARED=ON -DLIBCXX_ENABLE_STATIC=OFF -DLIBCXX_INCLUDE_BENCHMARKS=OFF -DLIBCXX_INCLUDE_TESTS=ON -DLIBCXXABI_ENABLE_SHARED=ON -DLIBCXXABI_ENABLE_STATIC=OFF -DLIBUNWIND_ENABLE_SHARED=ON -DLIBUNWIND_ENABLE_STATIC=OFF -DLIBCXXABI_USE_LLVM_UNWINDER=ON -DLIBCXX_USE_COMPILER_RT=ON -DLIBCXXABI_USE_COMPILER_RT=ON -DLIBUNWIND_USE_COMPILER_RT=ON -DLIBCXX_HAS_ATOMIC_LIB=OFF -DLIBCXX_HAS_GCC_S_LIB=OFF -DLLVM_ENABLE_PER_TARGET_RUNTIME_DIR=ON -DLLVM_EXTERNAL_LIT={repo_root}/build/release/bin/llvm-lit && cmake -E env CLANG_NO_DEFAULT_CONFIG=1 cmake --build build/runtimes/cxx -j {jobs:4} --target install-cxx install-cxxabi install-unwind && cmake -E copy_directory build/runtimes/stage build/release && cmake -E copy clang/vigine-config/linux/clang.cfg clang/vigine-config/linux/clang++.cfg build/release/bin && cmake -E env \"LIT_FILTER=vector.cons/|string.cons/\" cmake --build build/runtimes/cxx --target check-cxx && cmake -E env \"LIT_FILTER=catch_|dynamic_cast|test_exception\" cmake --build build/runtimes/cxx --target check-cxxabi && cmake --build build/runtimes/cxx --target check-unwind"
why = "Our C++ library, built by the compiler just built, every tool of it named, and made the compiler's default: libc++, libc++abi and libunwind shared, compiler-rt builtins and crtbegin/crtend, so a program needs nothing of GCC (no libstdc++, libgcc_s, libatomic, GCC's crt objects); libatomic and libgcc_s are stated off because a found library would be linked. The ABI namespace is __vigine, the same name as on the other systems. The C++ build links with --rtlib=compiler-rt before anything is in build/release, so it is given a copy of the compiler's resource folder with the new builtins in it (build/runtimes/resource, -resource-dir): the driver names the builtins by path and does not look elsewhere. Everything is installed into build/runtimes/stage first, with CLANG_NO_DEFAULT_CONFIG=1, and copied into build/release in one go together with the config files. The defaults are config files beside the driver, kept in clang/vigine-config/ (our own files beside clang, no new top-level folder in the fork), not compiled in, so the compiler is not rebuilt for them: -stdlib=libc++, --rtlib=compiler-rt, --unwindlib=libunwind, lld, and an rpath to the library folder. The tests then run against what is now in build/release."

[[step]]
id = "cleanup"
variant = "release"
systems = ["macos", "linux"]
run = "cmake -E rm -rf build/stage1 build/libxml2-bootstrap build/runtimes"
why = "Stage1, the bootstrap libxml2 and the runtimes' build folders are scaffolding. They are removed only after the passport is written, so the passport records this as the last step and everything it proves was still on disk when it was measured."

# ---- Windows: the system compiler is MSVC cl.exe (found through vcvars64.bat); stage1 is clang-cl with MSVC link.exe ----

[[step]]
id = "libxml2-bootstrap-windows"
variant = "release"
systems = ["windows"]
run = "cmake -S external/libxml2 -B build/libxml2-bootstrap/obj -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=\"C:/Program Files/Microsoft Visual Studio/18/Insiders/VC/Tools/MSVC/14.51.36231/bin/Hostx64/x64/cl.exe\" -DCMAKE_CXX_COMPILER=\"C:/Program Files/Microsoft Visual Studio/18/Insiders/VC/Tools/MSVC/14.51.36231/bin/Hostx64/x64/cl.exe\" {settings} -DCMAKE_INSTALL_PREFIX={repo_root}/build/libxml2-bootstrap -DCMAKE_INSTALL_LIBDIR=lib -DLIBXML2_WITH_ICONV=OFF -DLIBXML2_WITH_ICU=OFF -DLIBXML2_WITH_LZMA=OFF -DLIBXML2_WITH_ZLIB=OFF -DLIBXML2_WITH_PYTHON=OFF -DLIBXML2_WITH_PROGRAMS=OFF -DLIBXML2_WITH_TESTS=OFF -DLIBXML2_WITH_MODULES=OFF && cmake --build build/libxml2-bootstrap/obj && cmake --install build/libxml2-bootstrap/obj"
why = "Same as the posix bootstrap, with MSVC cl.exe (the Visual Studio environment comes from vcvars64.bat, which the build wrapper loads) as the system compiler; the static library is libxml2s.lib."

[[step]]
id = "llvm-stage1-windows"
variant = "release"
systems = ["windows"]
run = "cmake -S llvm -B build/stage1 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=\"C:/Program Files/Microsoft Visual Studio/18/Insiders/VC/Tools/MSVC/14.51.36231/bin/Hostx64/x64/cl.exe\" -DCMAKE_CXX_COMPILER=\"C:/Program Files/Microsoft Visual Studio/18/Insiders/VC/Tools/MSVC/14.51.36231/bin/Hostx64/x64/cl.exe\" {settings} \"-DLLVM_ENABLE_PROJECTS=clang;lld\" -DLLVM_TARGETS_TO_BUILD=host -DLLVM_ENABLE_LIBEDIT=OFF -DLLVM_ENABLE_ASSERTIONS=OFF -DLLVM_ENABLE_LIBXML2=FORCE_ON -DLIBXML2_INCLUDE_DIR={repo_root}/build/libxml2-bootstrap/include/libxml2 -DLIBXML2_LIBRARY={repo_root}/build/libxml2-bootstrap/lib/libxml2s.lib -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_DOCS=OFF && cmake --build build/stage1 --target clang lld"
why = "Same as the posix stage1, built by MSVC cl.exe and linked by MSVC link.exe; like it, it needs neither RTTI nor clang-tools-extra."

[[step]]
id = "libxml2-ours-windows"
variant = "release"
systems = ["windows"]
run = "cmake -S external/libxml2 -B build/libxml2/obj -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER={repo_root}/build/stage1/bin/clang-cl.exe -DCMAKE_CXX_COMPILER={repo_root}/build/stage1/bin/clang-cl.exe {settings} -DCMAKE_INSTALL_PREFIX={repo_root}/build/libxml2 -DCMAKE_INSTALL_LIBDIR=lib -DLIBXML2_WITH_ICONV=OFF -DLIBXML2_WITH_ICU=OFF -DLIBXML2_WITH_LZMA=OFF -DLIBXML2_WITH_ZLIB=OFF -DLIBXML2_WITH_PYTHON=OFF -DLIBXML2_WITH_PROGRAMS=OFF -DLIBXML2_WITH_TESTS=OFF -DLIBXML2_WITH_MODULES=OFF && cmake --build build/libxml2/obj && cmake --install build/libxml2/obj"
why = "libxml2 built by our own clang-cl (stage1)."

[[step]]
id = "llvm-release-windows"
variant = "release"
systems = ["windows"]
run = "cmake -S llvm -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER={repo_root}/build/stage1/bin/clang-cl.exe -DCMAKE_CXX_COMPILER={repo_root}/build/stage1/bin/clang-cl.exe -DCMAKE_LINKER={repo_root}/build/stage1/bin/lld-link.exe -DCMAKE_RC_COMPILER=rc.exe -DCMAKE_MT=mt.exe {settings} \"-DLLVM_ENABLE_PROJECTS=clang;lld;clang-tools-extra\" -DLLVM_ENABLE_RTTI=ON -DLLVM_ENABLE_EH=OFF -DLLVM_ENABLE_LIBEDIT=OFF -DLLVM_TARGETS_TO_BUILD=host -DLLVM_ENABLE_ASSERTIONS=OFF -DLLVM_ENABLE_LIBXML2=FORCE_ON -DLIBXML2_INCLUDE_DIR={repo_root}/build/libxml2/include/libxml2 -DLIBXML2_LIBRARY={repo_root}/build/libxml2/lib/libxml2s.lib -DLLVM_ENABLE_ZLIB=ON -DLLVM_ENABLE_ZSTD=ON -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_DOCS=OFF && cmake --build build/release"
why = "The compiler: LLVM with clang, lld and clang-tools-extra (clang-tidy, clang-format, clang-include-cleaner are built and installed with it), host target, built by stage1 with our libxml2. LLVM_ENABLE_RTTI=ON: the installed libraries carry RTTI so every consumer (CodeParser) builds against them without a no-RTTI exception (owner, 16.11). LLVM_ENABLE_EH=OFF: exceptions stay off, as in the package installed before. LLVM_ENABLE_LIBEDIT=OFF: libedit is a system library outside our forks, and the compiler takes nothing from the system and is built the same way on every machine (owner, 16.11). Built by stage1's clang-cl and lld-link with our libxml2; the resource and manifest compilers are the Windows SDK's rc.exe and mt.exe from the Visual Studio environment."

[[step]]
id = "runtimes-windows"
variant = "release"
systems = ["windows"]
run = "cmake -E env CLANG_NO_DEFAULT_CONFIG=1 cmake -S runtimes -B build/runtimes/cxx-mdd -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER={repo_root}/build/release/bin/clang-cl.exe -DCMAKE_CXX_COMPILER={repo_root}/build/release/bin/clang-cl.exe -DCMAKE_ASM_COMPILER={repo_root}/build/release/bin/clang-cl.exe -DCMAKE_LINKER={repo_root}/build/release/bin/lld-link.exe -DCMAKE_AR={repo_root}/build/release/bin/llvm-lib.exe -DCMAKE_RC_COMPILER={repo_root}/build/release/bin/llvm-rc.exe -DCMAKE_MT={repo_root}/build/release/bin/llvm-mt.exe -DCMAKE_INSTALL_PREFIX={repo_root}/build/runtimes/stage -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDebugDLL -DLLVM_ENABLE_RUNTIMES=libcxx -DLIBCXX_ABI_NAMESPACE=__vigine -DLIBCXX_ENABLE_SHARED=ON -DLIBCXX_ENABLE_STATIC=OFF -DLIBCXX_INCLUDE_BENCHMARKS=OFF -DLIBCXX_INCLUDE_TESTS=ON -DLIBCXX_SHARED_OUTPUT_NAME=c++d -DLLVM_EXTERNAL_LIT={repo_root}/build/release/bin/llvm-lit.py && cmake -E env CLANG_NO_DEFAULT_CONFIG=1 cmake --build build/runtimes/cxx-mdd -j {jobs:15} --target install-cxx && cmake -E env CLANG_NO_DEFAULT_CONFIG=1 cmake -S runtimes -B build/runtimes/cxx-md -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER={repo_root}/build/release/bin/clang-cl.exe -DCMAKE_CXX_COMPILER={repo_root}/build/release/bin/clang-cl.exe -DCMAKE_ASM_COMPILER={repo_root}/build/release/bin/clang-cl.exe -DCMAKE_LINKER={repo_root}/build/release/bin/lld-link.exe -DCMAKE_AR={repo_root}/build/release/bin/llvm-lib.exe -DCMAKE_RC_COMPILER={repo_root}/build/release/bin/llvm-rc.exe -DCMAKE_MT={repo_root}/build/release/bin/llvm-mt.exe -DCMAKE_INSTALL_PREFIX={repo_root}/build/runtimes/stage -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DLLVM_ENABLE_RUNTIMES=libcxx -DLIBCXX_ABI_NAMESPACE=__vigine -DLIBCXX_ENABLE_SHARED=ON -DLIBCXX_ENABLE_STATIC=OFF -DLIBCXX_INCLUDE_BENCHMARKS=OFF -DLIBCXX_INCLUDE_TESTS=ON -DLLVM_EXTERNAL_LIT={repo_root}/build/release/bin/llvm-lit.py && cmake -E env CLANG_NO_DEFAULT_CONFIG=1 cmake --build build/runtimes/cxx-md -j {jobs:15} --target install-cxx && cmake -E env CLANG_NO_DEFAULT_CONFIG=1 cmake -S runtimes -B build/runtimes/omp -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER={repo_root}/build/release/bin/clang-cl.exe -DCMAKE_CXX_COMPILER={repo_root}/build/release/bin/clang-cl.exe -DCMAKE_ASM_COMPILER={repo_root}/build/release/bin/clang-cl.exe -DCMAKE_LINKER={repo_root}/build/release/bin/lld-link.exe -DCMAKE_AR={repo_root}/build/release/bin/llvm-lib.exe -DCMAKE_RC_COMPILER={repo_root}/build/release/bin/llvm-rc.exe -DCMAKE_MT={repo_root}/build/release/bin/llvm-mt.exe -DCMAKE_INSTALL_PREFIX={repo_root}/build/runtimes/stage -DCMAKE_ASM_MASM_COMPILER={repo_root}/build/release/bin/llvm-ml.exe -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DLLVM_ENABLE_RUNTIMES=openmp -DOPENMP_ENABLE_LIBOMPTARGET=OFF -DLIBOMP_ENABLE_SHARED=ON -DCMAKE_INSTALL_INCLUDEDIR=lib/clang/23/include -DPython3_EXECUTABLE={tool:python} -DLLVM_INCLUDE_TESTS=OFF && cmake -E env CLANG_NO_DEFAULT_CONFIG=1 cmake --build build/runtimes/omp -j {jobs:15} --target install && cmake -E copy_directory build/runtimes/stage build/release && cmake -E copy clang/vigine-config/windows/clang-cl.cfg clang/vigine-config/windows/clang++.cfg clang/vigine-config/windows/clang.cfg build/release/bin && cmake -E env LIT_FILTER=vector.cons/ cmake --build build/runtimes/cxx-md --target check-cxx && cmake -E env LIT_FILTER=string.cons/ cmake --build build/runtimes/cxx-md --target check-cxx"
why = "Our C++ library on Windows, built by the clang-cl just built, every tool of it named. Only libc++ can be ours there: libc++abi and libunwind refuse the MSVC target, which keeps the Microsoft C++ ABI (vcruntime). It is built twice, for -MDd (c++d.dll, c++d.lib) and -MD (c++.dll, c++.lib), so a debug program does not mix two C heaps; our libc++ header asks the linker for c++d.lib when _DEBUG is defined and c++.lib otherwise, so neither needs a flag. libomp is ours too, because the engine's OpenMP would otherwise take Visual Studio's; its omp.h goes into the compiler's resource folder, searched before Visual Studio's. Everything is installed into build/runtimes/stage first, with CLANG_NO_DEFAULT_CONFIG=1, and copied into build/release in one go together with the config files, kept in clang/vigine-config/ (our own files beside clang, no new top-level folder in the fork). clang-cl has no default-library switch, so its config file names our header folder (-isystem, before clang's and Visual Studio's) and our library folder; clang++.cfg and clang.cfg are there so clang-cl in g++ or gcc mode (as libc++'s own tests run it) does not fall back to clang-cl.cfg. The tests then run on the -MD build against what is now in build/release; the -MDd build is checked by a /MDd program."

[[step]]
id = "cleanup-windows"
variant = "release"
systems = ["windows"]
run = "cmake -E rm -rf build/stage1 build/libxml2-bootstrap build/runtimes"
why = "Same as the posix cleanup: scaffolding goes only after the passport is written, so the passport records this as the last step."

[[rule]]
text = "Job limits are stated per system and reach both LLVM steps (llvm-stage1 and llvm-release) through {settings}: one link job everywhere, because a single LLVM link needs several gigabytes (clang and lld with LTO off still peak near 3 to 8 GB) and the machines are small (Ubuntu 7.7 GiB RAM and 4 cores, macOS 8 GB and 8 cores, Windows 31 GB and 16 logical cores). Compile jobs are the cores minus one (macOS 7, Windows 15) except Ubuntu, where they are one per core (4): it is the slowest machine and has no desktop work to leave a core for, and 16.11 its compile jobs peaked near 0.6 GB each (top: three clang++ at 594-625 MB resident), so four compiles beside the one link stay inside 7.7 GiB."

[[rule]]
text = "Windows links libxml2 statically (libxml2s.lib), which needs two things every consumer must state: LIBXML_STATIC, or the headers declare the functions dllimport and nothing links; and bcrypt.lib, which the static library's random-number code calls. LLVM's own libxml2 check and the LLVM and clang programs both need them, so they are settings for the whole windows build (CMAKE_C_FLAGS, CMAKE_CXX_FLAGS, CMAKE_EXE_LINKER_FLAGS), found by the failed link of the xmlReadMemory check (__imp_xmlReadMemory, then BCryptGenRandom unresolved)."

[[rule]]
text = "The system compiler builds stage1; stage1 builds the release compiler; every other project is built with the release compiler. No third pass (owner, 11.11)."

[[rule]]
text = "Symbol visibility is written as default on purpose: LLVM and clang export their own symbols (plugins, libclang) and rely on default visibility; the hidden preset that other repositories use would break them. LLVM's static build has no shared libraries to restrict, so the shared linker flags are only stated, not needed."

[[rule]]
text = "libxml2 is built only here, from external/libxml2; LLVM never links the system libxml2. LIBXML2_INCLUDE_DIR and LIBXML2_LIBRARY always point into build/libxml2-bootstrap (stage1) or build/libxml2 (release)."

[[rule]]
text = "The debug variant is not built: LLVM's libraries are release-mode for both install variants."

[[exception]]
check = "passport.variant-built.debug"
why = "The debug variant of LLVM is tens of gigabytes and hours; LLVM's libraries are release-mode for both install variants."
decided_by = "owner"
date = "2026-11-11"

[[exception]]
check = "passport.compiler-ours"
why = "Steps libxml2-bootstrap and llvm-stage1 use the system compiler to bootstrap; the compiler that finally builds is stage1, then release."
decided_by = "owner"
date = "2026-11-11"

[[rule]]
text = "No pkg-config: CMAKE_DISABLE_FIND_PACKAGE_PkgConfig is ON for every system. Our libxml2 is given by its paths (LIBXML2_INCLUDE_DIR, LIBXML2_LIBRARY), yet FindLibXml2 still asked the machine's pkg-config and wrote the system SDK's libxml2 into the cache (16.11, Mac: PC_LIBXML_INCLUDEDIR -> /Library/Developer/CommandLineTools/SDKs/MacOSX26.sdk/usr/include), which the passport then refused as a cache made on another SDK. The compiler takes nothing from the system's package lists. LLVM's own FindLibEdit calls pkg_check_modules with no guard, so libedit is stated OFF in the first pass too (it is OFF in the final pass by the owner's word of 16.11): with pkg-config disabled an unstated libedit stops the configure."

[[rule]]
text = "Everything that can be ours is ours (owner, 17.11): every program built with our compiler takes our C++ library by default, not the system's. What stays from each system and why: on macOS libSystem (the C library, threads, dyld and the unwinder: the only way into the kernel), the SDK's headers and .tbd stubs, and the libc++, libc++abi and libobjc the OS loads for itself, which we never link; on Linux glibc (libc, libm, libpthread, the dynamic loader, crt1/crti/crtn) and the kernel headers; on Windows vcruntime140 (the Microsoft C++ ABI: exceptions, type_info, new/delete), the UCRT, kernel32 and the Windows Kits headers and import libraries. These are the build passport's exceptions."

[[rule]]
text = "Our libc++ carries the ABI namespace __vigine on every system, so the one name means our library everywhere and its symbols never meet the system's libc++ (__1) in one process. No trailing digits: libc++'s vendor notes reserve __[0-9]+ for its own future ABI versions."

[[rule]]
text = "The compiler's defaults are config files beside the driver (clang.cfg, clang++.cfg, clang-cl.cfg in build/release/bin, kept in clang/vigine-config/<system>/), never compiled in: the compiler's own binaries keep their bytes, the files say in plain text what the default is, and <CFGDIR> makes them hold in the build folder and after install alike. Options from a config file are claimed, so a compile-only job does not warn about the link options. A build that must not see them (the runtimes step itself) sets CLANG_NO_DEFAULT_CONFIG=1."
